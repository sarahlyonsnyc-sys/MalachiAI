  { state: "Wyoming", abbr: "WY", tier: 4, body: "WHSAA", sanctioned: false, notes: "Smallest state. Tiny chess scene. But — border state to CO.", schools: 80, competition: "Very Low", priority: "Phase 3" },
  { state: "North Dakota", abbr: "ND", tier: 4, body: "NDHSAA", sanctioned: false, notes: "Very small scene.", schools: 120, competition: "Very Low", priority: "Phase 3" },

const competitors = [
  { name: "ChessKid (Chess.com)", type: "Platform", threat: "High", desc: "The 800-lb gorilla. Built by Chess.com, 500K+ monthly games, kid-safe, used by schools nationwide. Free tier + Gold ($49/yr). Strong puzzles and lessons. BUT: no cognitive assessment, no behavioral metrics, no school partnership model, no hardware.", moat: "CCC's cognitive data, behavioral tracking, and school pilot model are things ChessKid can't replicate easily. ChessKid is a playing platform. CCC is a developmental platform." },
  { name: "Lichess", type: "Platform", threat: "Medium", desc: "100% free, open source, no ads. Excellent analysis tools. Used by many school clubs for online play. BUT: no school-facing tools, no curriculum, no cognitive assessment, no teacher dashboard.", moat: "Lichess will always be free and that's hard to compete with on play alone. But Lichess has zero school infrastructure, zero data, zero pilot model." },
  { name: "Chess4Life", type: "Curriculum", threat: "Medium", desc: "Founded by NM Elliott Neff. Designed for schools/districts. Great curriculum, lesson plans, life skills integration (10 life skills mapped to chess). Class management tools. BUT: no AI play platform, no cognitive assessment, no hardware.", moat: "Chess4Life is the closest to CCC's school-facing philosophy but has no technology platform or data engine. You could actually partner with or learn from their curriculum approach." },
  { name: "Silver Knights Chess Academy", type: "Academy", threat: "Medium-High", desc: "350 school clubs in VA/MD/DC. 100+ online classes/week. 11 state champions in 2025. Winner of USCF Scholastic Service Award. BUT: regional (East Coast), coach-dependent model, no technology platform, no cognitive assessment.", moat: "Silver Knights is coach-driven, CCC is platform-driven. They can't scale without hiring more coaches. CCC scales with software." },
  { name: "Local chess coaches/clubs", type: "Fragmented", threat: "Low", desc: "Every city has local chess coaches who run school programs. They're your competition at the individual school level but can't compete on data, platform, or scale.", moat: "These are actually potential PARTNERS. A local coach can use CCC as their platform. You don't compete with them — you empower them." },
  { name: "Chess.com (adult)", type: "Platform", threat: "Low", desc: "Dominant for adult players. Not focused on scholastic or school integration. Some schools use it informally.", moat: "Chess.com isn't trying to be a school platform. Different market." },

const tierColors = { 1: "#22c55e", 2: "#C9A84C", 3: "#3b82f6", 4: "#666" };
const tierLabels = { 1: "STATE-SANCTIONED CHESS", 2: "STRONG INFRASTRUCTURE", 3: "ACTIVE SCENE", 4: "SMALLER MARKET" };

function App() {
  const [tab, setTab] = useState("map");
  const [selectedTier, setSelectedTier] = useState(null);
  const [expandedComp, setExpandedComp] = useState(null);
  const [search, setSearch] = useState("");

  const filtered = useMemo(() => {
    let list = states;
    if (selectedTier) list = list.filter(s => s.tier === selectedTier);
    if (search) list = list.filter(s => s.state.toLowerCase().includes(search.toLowerCase()) || s.abbr.toLowerCase().includes(search.toLowerCase()));
    return list;
  }, [selectedTier, search]);

  const tierCounts = { 1: states.filter(s => s.tier === 1).length, 2: states.filter(s => s.tier === 2).length, 3: states.filter(s => s.tier === 3).length, 4: states.filter(s => s.tier === 4).length };

  return (
    <div style={{ fontFamily: "'Georgia', serif", background: "#0d0d0d", color: "#F2ECD8", minHeight: "100vh" }}>
      {/* Header */}
      <div style={{ borderBottom: "1px solid #C9A84C30", padding: "16px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 100, background: "#0d0d0d" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 22 }}>♟</span>
          <div>
            <div style={{ fontSize: 10, letterSpacing: 3, color: "#C9A84C", fontFamily: "system-ui", fontWeight: 700 }}>50-STATE EXPANSION MAP</div>
            <div style={{ fontSize: 14, fontWeight: 700 }}>CCC Market Landscape</div>
          </div>
        </div>
      </div>

      {/* Tabs */}
      <div style={{ display: "flex", borderBottom: "1px solid #C9A84C20", background: "#111" }}>
        {[["map", "States"], ["comp", "Competitors"], ["plan", "Expansion Plan"]].map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)} style={{ flex: 1, padding: "14px", border: "none", borderBottom: tab === id ? "2px solid #C9A84C" : "2px solid transparent", background: "transparent", color: tab === id ? "#C9A84C" : "#666", cursor: "pointer", fontSize: 12, fontFamily: "system-ui", fontWeight: 600, letterSpacing: 0.5 }}>
            {label}
          </button>
        ))}
      </div>

      <div style={{ padding: 20, maxWidth: 800, margin: "0 auto" }}>
        {/* STATES TAB */}
        {tab === "map" && (
          <div>
            <h1 style={{ fontSize: 24, marginBottom: 6 }}>All 50 States + DC</h1>
            <p style={{ color: "#999", fontSize: 13, fontFamily: "system-ui", marginBottom: 20 }}>Tiered by readiness for CCC expansion. Filter by tier or search.</p>

            {/* Tier filters */}
            <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
              <button onClick={() => setSelectedTier(null)} style={{ padding: "6px 12px", borderRadius: 20, border: !selectedTier ? "1px solid #C9A84C" : "1px solid #333", background: !selectedTier ? "#C9A84C20" : "transparent", color: !selectedTier ? "#C9A84C" : "#666", cursor: "pointer", fontSize: 11, fontFamily: "system-ui", fontWeight: 600 }}>
                All ({states.length})
              </button>
              {[1, 2, 3, 4].map(t => (
                <button key={t} onClick={() => setSelectedTier(selectedTier === t ? null : t)} style={{ padding: "6px 12px", borderRadius: 20, border: selectedTier === t ? `1px solid ${tierColors[t]}` : "1px solid #333", background: selectedTier === t ? tierColors[t] + "20" : "transparent", color: selectedTier === t ? tierColors[t] : "#666", cursor: "pointer", fontSize: 11, fontFamily: "system-ui", fontWeight: 600 }}>
                  Tier {t} ({tierCounts[t]})
                </button>
              ))}
            </div>

            <input
              type="text"
              placeholder="Search states..."
              value={search}
              onChange={e => setSearch(e.target.value)}
              style={{ width: "100%", padding: "10px 14px", borderRadius: 6, border: "1px solid #333", background: "#1a1a1a", color: "#F2ECD8", fontSize: 13, fontFamily: "system-ui", marginBottom: 16, boxSizing: "border-box" }}
            />

            {/* Tier legend */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 20 }}>
              {[1, 2, 3, 4].map(t => (
                <div key={t} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 11, fontFamily: "system-ui", color: "#999" }}>
                  <div style={{ width: 10, height: 10, borderRadius: "50%", background: tierColors[t], flexShrink: 0 }} />
                  <span><strong style={{ color: tierColors[t] }}>Tier {t}:</strong> {tierLabels[t]}</span>
                </div>
              ))}
            </div>

            {filtered.map((s, i) => (
              <div key={i} style={{ background: "#1a1a1a", border: "1px solid #ffffff10", borderLeft: `3px solid ${tierColors[s.tier]}`, borderRadius: 6, padding: "14px 16px", marginBottom: 8 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <span style={{ fontSize: 13, fontWeight: 700, fontFamily: "system-ui", color: tierColors[s.tier], minWidth: 28 }}>{s.abbr}</span>
                    <span style={{ fontSize: 14, fontWeight: 700 }}>{s.state}</span>
                    {s.sanctioned && <span style={{ background: "#22c55e20", color: "#22c55e", padding: "1px 6px", borderRadius: 3, fontSize: 9, fontWeight: 700, fontFamily: "system-ui" }}>SANCTIONED</span>}
                  </div>
                  <span style={{ fontSize: 10, fontFamily: "monospace", color: "#C9A84C", background: "#C9A84C15", padding: "2px 6px", borderRadius: 3 }}>{s.priority}</span>
                </div>
                <div style={{ fontSize: 11, fontFamily: "system-ui", color: "#888", marginBottom: 4 }}>
                  <strong>Body:</strong> {s.body} · <strong>~Schools:</strong> {s.schools} · <strong>Competition:</strong> {s.competition}
                </div>
                <p style={{ fontSize: 12, fontFamily: "system-ui", color: "#777", lineHeight: 1.5, margin: 0 }}>{s.notes}</p>
              </div>
            ))}
          </div>
        )}

        {/* COMPETITORS TAB */}
        {tab === "comp" && (
          <div>
            <h1 style={{ fontSize: 24, marginBottom: 6 }}>Competitive Landscape</h1>
            <p style={{ color: "#999", fontSize: 13, fontFamily: "system-ui", marginBottom: 20 }}>Your competitors and why CCC still wins.</p>

            {competitors.map((c, i) => (
              <div key={i} style={{ background: "#1a1a1a", border: expandedComp === i ? "1px solid #C9A84C60" : "1px solid #ffffff10", borderRadius: 8, marginBottom: 10, overflow: "hidden" }}>
                <button onClick={() => setExpandedComp(expandedComp === i ? null : i)} style={{ width: "100%", background: "transparent", border: "none", color: "#F2ECD8", padding: "16px 18px", display: "flex", alignItems: "center", justifyContent: "space-between", cursor: "pointer", fontFamily: "system-ui" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 12, textAlign: "left" }}>
                    <span style={{ fontWeight: 700, fontSize: 14 }}>{c.name}</span>
                    <span style={{ fontSize: 10, color: "#888", background: "#ffffff10", padding: "2px 6px", borderRadius: 3 }}>{c.type}</span>
                  </div>
                  <span style={{ background: c.threat === "High" || c.threat === "Medium-High" ? "#dc262630" : c.threat === "Medium" ? "#C9A84C30" : "#22c55e30", color: c.threat === "High" || c.threat === "Medium-High" ? "#dc2626" : c.threat === "Medium" ? "#C9A84C" : "#22c55e", padding: "2px 8px", borderRadius: 3, fontSize: 10, fontWeight: 700 }}>{c.threat} THREAT</span>

                {expandedComp === i && (
                  <div style={{ padding: "0 18px 18px" }}>
                    <p style={{ fontSize: 13, fontFamily: "system-ui", color: "#999", lineHeight: 1.6, margin: "0 0 12px" }}>{c.desc}</p>
                    <div style={{ background: "#0f1a0f", border: "1px solid #22c55e30", borderRadius: 6, padding: 14 }}>
                      <div style={{ fontSize: 10, letterSpacing: 2, color: "#22c55e", fontFamily: "system-ui", fontWeight: 700, marginBottom: 6 }}>CCC'S MOAT</div>
                      <p style={{ fontSize: 12, fontFamily: "system-ui", color: "#ccc", lineHeight: 1.5, margin: 0 }}>{c.moat}</p>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}

        {/* EXPANSION PLAN TAB */}
        {tab === "plan" && (
          <div>
            <h1 style={{ fontSize: 24, marginBottom: 6 }}>Recommended Expansion Path</h1>
            <p style={{ color: "#999", fontSize: 13, fontFamily: "system-ui", marginBottom: 24 }}>Geographic rings outward from Taos, prioritizing states with sanctioned chess or low competition.</p>

            {[
              { phase: "Phase 1: Home Base (Now)", color: "#22c55e", states: "New Mexico", strategy: "Prove the model in Taos County. Land 3 pilots. Build NMAA partnership. Become the official chess platform of NM before going anywhere else. You can't sell 'we did this in NM' until you've actually done it in NM." },
              { phase: "Phase 2: The Southwest Ring (2027)", color: "#C9A84C", states: "Arizona, Colorado, Oklahoma, Utah, Nevada, Texas (border regions)", strategy: "After proving the NMAA model, approach AIA (Arizona — also sanctions chess), CHSAA (Colorado), and border regions of Texas. These are all driving distance for in-person relationship building. Arizona is the #1 target — they sanction chess and are right next door. Colorado already sanctions esports via PlayVS, which shows openness to platform partnerships." },
              { phase: "Phase 3: Scale Nationally (2028+)", color: "#3b82f6", states: "Illinois, Texas (statewide), California, New York, + remaining states", strategy: "With 2-3 state partnerships and real data, approach the big markets. Illinois (IHSA chess since 1968, 128 teams at state) is the gold standard. Texas via TCA. California and New York are huge but fragmented — go after specific regions rather than the whole state. Also target underserved states (MS, WV, AR, etc.) where you'd be the first-mover with zero competition." },
            ].map((p, i) => (
              <div key={i} style={{ borderLeft: `3px solid ${p.color}`, paddingLeft: 20, marginBottom: 28 }}>
                <div style={{ fontSize: 12, fontWeight: 700, fontFamily: "system-ui", color: p.color, letterSpacing: 0.5, marginBottom: 6 }}>{p.phase}</div>
                <div style={{ fontSize: 11, fontFamily: "system-ui", color: "#888", marginBottom: 8 }}>Target states: <strong style={{ color: "#F2ECD8" }}>{p.states}</strong></div>
                <p style={{ fontSize: 13, fontFamily: "system-ui", color: "#999", lineHeight: 1.6, margin: 0 }}>{p.strategy}</p>
              </div>
            ))}

            <div style={{ background: "#1a1a1a", border: "1px solid #C9A84C30", borderRadius: 8, padding: 20, marginTop: 16 }}>
              <div style={{ fontSize: 10, letterSpacing: 2, color: "#C9A84C", fontFamily: "system-ui", fontWeight: 700, marginBottom: 10 }}>KEY TAKEAWAYS</div>
              {[
                "Only 3 states sanction chess through their activities association: NM, IL, AZ. These are your Tier 1 targets.",
                "ChessKid is everywhere but has no school partnership model, no pilots, no cognitive data. You're not competing on play — you're competing on outcomes.",
                "Silver Knights is the closest competitor model (350 school clubs) but they're coach-dependent and regional (VA/MD/DC). CCC is platform-dependent and scalable.",
                "20+ states have very low or zero scholastic chess competition. First-mover advantage is real in places like Mississippi, West Virginia, Arkansas.",
                "The PlayVS playbook works: start with one state association, prove it, then replicate. They went from 5 states (2018) to 25 (2024). You can too.",
              ].map((t, j) => (
                <div key={j} style={{ fontSize: 12, fontFamily: "system-ui", color: "#ccc", padding: "8px 0", borderBottom: j < 4 ? "1px solid #ffffff08" : "none", lineHeight: 1.5, display: "flex", gap: 8 }}>
                  <span style={{ color: "#C9A84C", flexShrink: 0 }}>→</span>{t}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
