<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classical Chess Collegium — Chess News</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Mono:wght@400;500&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="nav.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--black:#0a0a0a;--panel:#151515;--border:#2a2a2a;--gold:#c9a84c;--gold2:#e8c97a;--cream:#F2ECD8;--muted:#6b6b6b}
    body{background:var(--black);color:var(--cream);font-family:'Lato',sans-serif;min-height:100vh}
    .chess-bg{position:fixed;inset:0;z-index:0;opacity:0.02;background-image:repeating-conic-gradient(var(--gold) 0% 25%,transparent 0% 50%);background-size:48px 48px;pointer-events:none}

    .page{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:48px 24px}
    .page-eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:20px}
    .page-eyebrow::before{content:'';width:24px;height:1px;background:var(--gold)}
    .page-eyebrow span{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold)}
    .page-title{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,5vw,48px);font-weight:700;line-height:1.1;margin-bottom:12px}
    .page-title em{color:var(--gold);font-style:italic}
    .page-sub{font-size:15px;color:var(--muted);font-weight:300;line-height:1.7;max-width:560px;margin-bottom:40px}

    /* CATEGORY TABS */
    .tabs{display:flex;gap:0;border:1px solid var(--border);margin-bottom:32px;overflow-x:auto}
    .tab{flex:1;background:transparent;border:none;border-right:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:12px 16px;cursor:pointer;transition:all 0.2s;white-space:nowrap}
    .tab:last-child{border-right:none}
    .tab:hover{color:var(--cream);background:rgba(255,255,255,0.02)}
    .tab.active{background:var(--gold);color:var(--black);font-weight:500}

    /* NEWS CARDS */
    .news-list{display:flex;flex-direction:column;gap:24px}
    .news-card{background:var(--panel);border:1px solid var(--border);padding:28px;transition:border-color 0.2s;cursor:pointer}
    .news-card:hover{border-color:var(--gold)}
    .news-category{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
    .news-headline{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--cream);margin-bottom:8px;line-height:1.25}
    .news-excerpt{font-size:14px;color:var(--muted);font-weight:300;line-height:1.6;margin-bottom:12px}
    .news-meta{font-family:'DM Mono',monospace;font-size:9px;color:#555;letter-spacing:0.08em}
    .news-meta span{color:var(--gold)}

    /* FEATURED */
    .featured{background:var(--panel);border:1px solid var(--border);border-top:3px solid var(--gold);padding:36px;margin-bottom:32px}
    .featured .news-category{font-size:10px;margin-bottom:14px}
    .featured .news-headline{font-size:28px;margin-bottom:12px}
  </style>
</head>
<body>
<div class="chess-bg"></div>
<nav id="cccNav"></nav>

<div class="page">
  <div class="page-eyebrow"><span>Club — News</span></div>
  <h1 class="page-title">Chess <em>News.</em></h1>
  <p class="page-sub">Stay current with the chess world — from world championship coverage to scholastic results.</p>

  <div class="tabs">
    <button class="tab active" onclick="filterNews('all',this)">All</button>
    <button class="tab" onclick="filterNews('world',this)">World Chess</button>
    <button class="tab" onclick="filterNews('scholastic',this)">Scholastic</button>
    <button class="tab" onclick="filterNews('technology',this)">Tech & Tools</button>
    <button class="tab" onclick="filterNews('culture',this)">Culture</button>
  </div>

  <div id="newsContainer"></div>
</div>

<script>
const NEWS = [
  { cat:"world", headline:"Ding Liren Defends World Title in Dramatic Tiebreak", excerpt:"The defending champion held off challenger Gukesh D in a grueling 14-game match that came down to rapid tiebreaks in Singapore. The chess world watched as classical games produced 12 draws before the rapid format broke the deadlock.", date:"Mar 7, 2026", source:"FIDE", featured:true },
  { cat:"scholastic", headline:"Ohio Scholastic Chess Participation Hits Record High", excerpt:"More than 4,200 K-12 students are registered for competitive chess programs across Ohio this season, a 23% increase from last year. After-school programs are driving the growth.", date:"Mar 5, 2026", source:"Ohio Chess Association" },
  { cat:"technology", headline:"The Rise of Behavioral Analytics in Chess Education", excerpt:"New platforms are using move-timing data and game behavior patterns to assess cognitive development in young players — going beyond traditional rating systems.", date:"Mar 3, 2026", source:"Chess Education Weekly" },
  { cat:"world", headline:"Candidates Tournament Field Set for Toronto 2026", excerpt:"Eight players will compete for the right to challenge the World Champion. The field includes three first-time qualifiers and the youngest candidate in FIDE history.", date:"Feb 28, 2026", source:"FIDE" },
  { cat:"scholastic", headline:"CCC Partners with 12 New Schools in Northeast Ohio", excerpt:"The Classical Chess Collegium expanded its after-school program to 12 additional elementary and middle schools, bringing total enrollment to over 800 students.", date:"Feb 25, 2026", source:"CCC Press" },
  { cat:"culture", headline:"Why Silicon Valley Executives Are Turning to Chess", excerpt:"From board rooms to chess boards — a growing number of tech leaders are citing chess as their preferred tool for sharpening strategic thinking and decision-making.", date:"Feb 20, 2026", source:"The Wall Street Journal" },
  { cat:"technology", headline:"Cognitive Assessment Through Chess: A New Frontier", excerpt:"Researchers at Karolinska Institutet published findings showing chess players exhibit reorganized cognitive architecture with enhanced executive function networks.", date:"Feb 15, 2026", source:"Frontiers in Psychology" },
  { cat:"scholastic", headline:"National Chess Day Brings 500 New Students to the Game", excerpt:"Schools across 14 states participated in National Chess Day events, introducing hundreds of students to competitive chess for the first time.", date:"Feb 10, 2026", source:"US Chess" },
];

function renderNews(list) {
  const container = document.getElementById('newsContainer');
  const featured = list.find(n => n.featured);
  const rest = list.filter(n => n !== featured);
  let html = '';
  if (featured) {
    html += `<div class="featured">
      <div class="news-category">${featured.cat} · FEATURED</div>
      <div class="news-headline">${featured.headline}</div>
      <div class="news-excerpt">${featured.excerpt}</div>
      <div class="news-meta">${featured.date} · <span>${featured.source}</span></div>
    </div>`;
  }
  html += '<div class="news-list">' + rest.map(n => `
    <div class="news-card">
      <div class="news-category">${n.cat}</div>
      <div class="news-headline">${n.headline}</div>
      <div class="news-excerpt">${n.excerpt}</div>
      <div class="news-meta">${n.date} · <span>${n.source}</span></div>
    </div>
  `).join('') + '</div>';
  container.innerHTML = html;
}

function filterNews(cat, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderNews(cat === 'all' ? NEWS : NEWS.filter(n => n.cat === cat));
}

renderNews(NEWS);
</script>
<script src="nav.js"></script>
</body>
</html>
