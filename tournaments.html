<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classical Chess Collegium — Tournament Locator</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Mono:wght@400;500&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="nav.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--black:#0a0a0a;--panel:#151515;--border:#2a2a2a;--gold:#c9a84c;--gold2:#e8c97a;--cream:#F2ECD8;--muted:#6b6b6b}
    body{background:var(--black);color:var(--cream);font-family:'Lato',sans-serif;min-height:100vh}
    .chess-bg{position:fixed;inset:0;z-index:0;opacity:0.02;background-image:repeating-conic-gradient(var(--gold) 0% 25%,transparent 0% 50%);background-size:48px 48px;pointer-events:none}
    .page{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:48px 24px}
    .page-eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:20px}
    .page-eyebrow::before{content:'';width:24px;height:1px;background:var(--gold)}
    .page-eyebrow span{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold)}
    .page-title{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,5vw,48px);font-weight:700;line-height:1.1;margin-bottom:12px}
    .page-title em{color:var(--gold);font-style:italic}
    .page-sub{font-size:15px;color:var(--muted);font-weight:300;line-height:1.7;max-width:560px;margin-bottom:32px}

    .stats-row{display:flex;gap:16px;margin-bottom:32px;flex-wrap:wrap}
    .stat-pill{background:var(--panel);border:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:10px}
    .stat-pill .sv{font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:var(--gold)}
    .stat-pill .sl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)}

    .filters{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
    .filter-input{background:var(--panel);border:1px solid var(--border);color:var(--cream);font-family:'Lato',sans-serif;font-size:13px;padding:10px 16px;outline:none;transition:border-color 0.2s;flex:1;min-width:180px}
    .filter-input:focus{border-color:var(--gold)}
    .filter-input::placeholder{color:var(--muted)}
    .filter-select{background:var(--panel);border:1px solid var(--border);color:var(--cream);font-family:'Lato',sans-serif;font-size:13px;padding:10px 16px;outline:none;appearance:none;cursor:pointer;min-width:120px}
    .filter-btn{background:var(--gold);color:var(--black);border:none;padding:10px 24px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:500;cursor:pointer;transition:background 0.2s}
    .filter-btn:hover{background:var(--gold2)}

    .tournament-grid{display:flex;flex-direction:column;gap:12px}
    .tourney-card{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--gold);padding:20px 24px;display:flex;align-items:center;gap:20px;transition:border-color 0.2s;text-decoration:none}
    .tourney-card:hover{border-color:var(--gold)}
    .tourney-card.ccc-event{border-left-color:#4caf50}
    .tourney-card.featured{border-left-color:var(--gold);border-left-width:4px;background:rgba(201,168,76,0.03)}
    .tourney-date{flex-shrink:0;text-align:center;width:52px}
    .tourney-date .month{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold)}
    .tourney-date .day{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;color:var(--cream);line-height:1}
    .tourney-info{flex:1;min-width:0}
    .tourney-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--cream);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tourney-meta{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:0.04em}
    .tourney-meta span{color:var(--gold)}
    .tourney-badges{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
    .t-badge{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.08em;text-transform:uppercase;padding:3px 8px;border:1px solid}
    .t-badge.national{border-color:rgba(201,168,76,0.5);color:var(--gold)}
    .t-badge.scholastic{border-color:rgba(76,175,80,0.4);color:#4caf50}
    .t-badge.open{border-color:rgba(91,141,238,0.3);color:#5b8dee}
    .t-badge.rapid{border-color:rgba(156,111,228,0.4);color:#9c6fe4}
    .t-badge.blitz{border-color:rgba(255,152,0,0.4);color:#ff9800}
    .t-badge.classical{border-color:rgba(91,141,238,0.3);color:#5b8dee}
    .t-badge.reg-open{border-color:rgba(76,175,80,0.5);color:#4caf50;background:rgba(76,175,80,0.08)}
    .t-badge.ccc{border-color:rgba(201,168,76,0.6);color:var(--gold);background:rgba(201,168,76,0.08)}

    .loading-msg{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-align:center;padding:40px;letter-spacing:0.1em}
    .empty-state{text-align:center;padding:40px;color:var(--muted);font-size:13px}
    .source-note{font-family:'DM Mono',monospace;font-size:9px;color:#444;margin-top:20px;text-align:center;letter-spacing:0.06em}
    .source-note a{color:var(--gold);text-decoration:none}

    @media(max-width:600px){
      .tourney-card{flex-wrap:wrap;gap:12px}
      .tourney-badges{width:100%}
    }
  </style>
</head>
<body>
<div class="chess-bg"></div>
<nav id="cccNav"></nav>
<div class="page">
  <div class="page-eyebrow"><span>Club — Tournaments</span></div>
  <h1 class="page-title">Find Your Next <em>Tournament.</em></h1>
  <p class="page-sub">Search upcoming chess tournaments nationwide. Scholastic, open, rapid, and classical events from US Chess and CCC.</p>

  <div class="stats-row" id="statsRow"></div>

  <div class="filters">
    <input class="filter-input" type="text" placeholder="Search name, city, organizer..." id="searchInput">
    <select class="filter-select" id="stateFilter">
      <option value="">All States</option>
      <option value="OH">Ohio</option>
      <option value="FL">Florida</option>
      <option value="TX">Texas</option>
      <option value="CA">California</option>
      <option value="NY">New York</option>
      <option value="PA">Pennsylvania</option>
      <option value="IL">Illinois</option>
      <option value="MI">Michigan</option>
      <option value="NC">North Carolina</option>
      <option value="VA">Virginia</option>
      <option value="NJ">New Jersey</option>
      <option value="MO">Missouri</option>
      <option value="IN">Indiana</option>
      <option value="NV">Nevada</option>
      <option value="MD">Maryland</option>
    </select>
    <select class="filter-select" id="formatFilter">
      <option value="">All Formats</option>
      <option>Scholastic</option>
      <option>Classical</option>
      <option>Rapid</option>
      <option>Blitz</option>
      <option>Open</option>
    </select>
    <button class="filter-btn" onclick="applyFilters()">Search</button>
  </div>

  <div class="tournament-grid" id="tournamentGrid"><div class="loading-msg">LOADING TOURNAMENTS...</div></div>
  <div class="source-note">Data sourced from <a href="https://new.uschess.org/upcoming-tournaments" target="_blank">US Chess</a>, <a href="https://new.uschess.org/plan-ahead-calendar" target="_blank">Plan Ahead Calendar</a>, and CCC events</div>
</div>

<script>
const SB_URL='https://nlsmrveieqadjmytsmjm.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sc21ydmVpZXFhZGpteXRzbWptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3MTg4NjcsImV4cCI6MjA4NzI5NDg2N30.9uIWjPJsOhdXXHqGLIMcdY5eitbkGoHyhbreAEe-apM';
const{createClient}=supabase;
const sb=createClient(SB_URL,SB_KEY,{auth:{persistSession:true,storageKey:'ccc-auth'}});

let allTournaments = [];

async function loadTournaments() {
  const grid = document.getElementById('tournamentGrid');
  try {
    const today = new Date().toISOString().split('T')[0];
    const { data, error } = await sb.from('tournaments')
      .select('*')
      .gte('date_start', today)
      .order('date_start', { ascending: true });

    if (error) throw error;
    if (!data || data.length === 0) throw new Error('No data');

    allTournaments = data;
    renderTournaments(data);
    renderStats(data);

  } catch(e) {
    console.log('Tournaments table not found or empty, showing setup message:', e.message);
    grid.innerHTML = `<div class="empty-state">
      <div style="font-size:40px;margin-bottom:16px;opacity:0.3">🏆</div>
      <div style="margin-bottom:12px">No tournaments loaded yet.</div>
      <div style="font-size:12px;color:#555">Run <strong>tournaments_schema.sql</strong> in your Supabase SQL Editor to create the table and seed it with 35+ nationwide events.</div>
    </div>`;
  }
}

function renderStats(data) {
  const states = new Set(data.map(t => t.state).filter(Boolean));
  const scholastic = data.filter(t => t.format === 'Scholastic').length;
  const ccc = data.filter(t => t.is_ccc_event).length;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-pill"><div class="sv">${data.length}</div><div class="sl">Upcoming Events</div></div>
    <div class="stat-pill"><div class="sv">${states.size}</div><div class="sl">States</div></div>
    <div class="stat-pill"><div class="sv">${scholastic}</div><div class="sl">Scholastic</div></div>
    ${ccc > 0 ? `<div class="stat-pill"><div class="sv">${ccc}</div><div class="sl">CCC Events</div></div>` : ''}
  `;
}

function renderTournaments(list) {
  const grid = document.getElementById('tournamentGrid');
  if (list.length === 0) {
    grid.innerHTML = '<div class="empty-state">No tournaments match your filters. Try broadening your search.</div>';
    return;
  }
  grid.innerHTML = list.map(t => {
    const d = new Date(t.date_start + 'T00:00:00');
    const month = d.toLocaleDateString('en-US',{month:'short'}).toUpperCase();
    const day = d.getDate();
    const dateStr = d.toLocaleDateString('en-US',{month:'long',day:'numeric'});
    const endStr = t.date_end ? ' – ' + new Date(t.date_end+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric'}) : '';
    const loc = [t.city, t.state].filter(Boolean).join(', ');
    const isCCC = t.is_ccc_event || t.source === 'ccc';
    const cardClass = isCCC ? 'ccc-event' : (t.is_featured ? 'featured' : '');

    // Badges
    let badges = '';
    const fmtClass = (t.format||'').toLowerCase().replace(/\s/g,'');
    if (t.format) badges += `<span class="t-badge ${fmtClass === 'open' ? 'open' : fmtClass}">${t.format}</span>`;
    if (t.status === 'registration_open') badges += '<span class="t-badge reg-open">Reg Open</span>';
    if (isCCC) badges += '<span class="t-badge ccc">CCC</span>';

    const href = t.registration_url || t.source_url || '#';
    const target = href !== '#' ? ' target="_blank" rel="noopener"' : '';

    return `<a class="tourney-card ${cardClass}" href="${href}"${target}>
      <div class="tourney-date"><div class="month">${month}</div><div class="day">${day}</div></div>
      <div class="tourney-info">
        <div class="tourney-name">${t.name}</div>
        <div class="tourney-meta">${loc} · <span>${dateStr}${endStr}</span> · ${t.organizer || t.source}</div>
      </div>
      <div class="tourney-badges">${badges}</div>
    </a>`;
  }).join('');
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const state = document.getElementById('stateFilter').value;
  const fmt = document.getElementById('formatFilter').value;
  let list = allTournaments;
  if (q) list = list.filter(t => [t.name,t.city,t.state,t.organizer].join(' ').toLowerCase().includes(q));
  if (state) list = list.filter(t => t.state === state);
  if (fmt) list = list.filter(t => t.format === fmt);
  renderTournaments(list);
}

document.getElementById('searchInput').addEventListener('keyup', e => { if(e.key==='Enter') applyFilters(); });
document.getElementById('stateFilter').addEventListener('change', applyFilters);
document.getElementById('formatFilter').addEventListener('change', applyFilters);
loadTournaments();
</script>
<script src="nav.js"></script>
</body>
</html>
