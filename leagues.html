<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classical Chess Collegium — Leagues & Standings</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Mono:wght@400;500&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="nav.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--black:#0a0a0a;--panel:#151515;--border:#2a2a2a;--gold:#c9a84c;--gold2:#e8c97a;--cream:#F2ECD8;--muted:#6b6b6b;--green:#4caf50;--red:#e05068}
    body{background:var(--black);color:var(--cream);font-family:'Lato',sans-serif;min-height:100vh}
    .chess-bg{position:fixed;inset:0;z-index:0;opacity:0.02;background-image:repeating-conic-gradient(var(--gold) 0% 25%,transparent 0% 50%);background-size:48px 48px;pointer-events:none}
    .page{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:48px 24px}
    .page-eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:20px}
    .page-eyebrow::before{content:'';width:24px;height:1px;background:var(--gold)}
    .page-eyebrow span{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold)}
    .page-title{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,5vw,48px);font-weight:700;line-height:1.1;margin-bottom:12px}
    .page-title em{color:var(--gold);font-style:italic}
    .page-sub{font-size:15px;color:var(--muted);font-weight:300;line-height:1.7;max-width:600px;margin-bottom:40px}
    .season-banner{background:var(--panel);border:1px solid var(--border);border-top:3px solid var(--gold);padding:28px 32px;display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:16px}
    .season-info .season-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
    .season-info .season-name{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;color:var(--cream)}
    .season-stats{display:flex;gap:32px}
    .season-stat{text-align:center}
    .season-stat .sv{font-family:'DM Mono',monospace;font-size:24px;font-weight:700;color:var(--gold)}
    .season-stat .sl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-top:2px}
    .leagues-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:40px}
    @media(max-width:700px){.leagues-grid{grid-template-columns:1fr}}
    .league-card{background:var(--panel);border:1px solid var(--border);padding:28px;transition:border-color 0.2s}
    .league-card:hover{border-color:var(--gold)}
    .league-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .league-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--cream)}
    .league-badge{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px;border:1px solid rgba(201,168,76,0.3);color:var(--gold)}
    .standings-row{display:grid;grid-template-columns:28px 1fr 50px 50px 50px 50px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px}
    .standings-row.header{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--border)}
    .standings-pos{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-align:center}
    .standings-row:nth-child(2) .standings-pos{color:var(--gold);font-weight:700}
    .standings-team{font-size:13px;color:var(--cream)}
    .standings-val{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-align:center}
    .standings-val.w{color:var(--green)}
    .standings-val.l{color:var(--red)}
    .standings-val.pts{color:var(--gold);font-weight:500}
    .loading-msg{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-align:center;padding:40px;letter-spacing:0.1em}
    .demo-badge{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,0.03);border:1px solid var(--border);padding:6px 12px;display:inline-block;margin-bottom:24px}
  </style>
</head>
<body>
<div class="chess-bg"></div>
<nav id="cccNav"></nav>
<div class="page">
  <div class="page-eyebrow"><span>Club — Leagues</span></div>
  <h1 class="page-title">Leagues &amp; <em>Standings.</em></h1>
  <p class="page-sub">Track team standings across scholastic chess leagues. Seasons run September through May with playoffs in June.</p>
  <div id="seasonBanner"></div>
  <div id="leaguesGrid" class="leagues-grid"><div class="loading-msg">LOADING STANDINGS...</div></div>
</div>
<script>
const SB_URL='https://nlsmrveieqadjmytsmjm.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sc21ydmVpZXFhZGpteXRzbWptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3MTg4NjcsImV4cCI6MjA4NzI5NDg2N30.9uIWjPJsOhdXXHqGLIMcdY5eitbkGoHyhbreAEe-apM';
const{createClient}=supabase;
const sb=createClient(SB_URL,SB_KEY,{auth:{persistSession:true,storageKey:'ccc-auth'}});

// Demo data as fallback
const DEMO_LEAGUES=[
  {name:"Northeast Ohio Elementary",division:"K-5",teams:[
    {team_name:"Lincoln Lions",wins:7,losses:1,draws:0,total_points:21},
    {team_name:"Roosevelt Rooks",wins:6,losses:2,draws:0,total_points:18},
    {team_name:"Hawthorne Knights",wins:5,losses:2,draws:1,total_points:16},
    {team_name:"St. Mary's Bishops",wins:4,losses:3,draws:1,total_points:13},
    {team_name:"Westlake Pawns",wins:3,losses:5,draws:0,total_points:9},
    {team_name:"Central Castles",wins:1,losses:7,draws:0,total_points:3},
  ]},
  {name:"Northeast Ohio Middle School",division:"6-8",teams:[
    {team_name:"Hawthorne Academy",wins:7,losses:0,draws:1,total_points:22},
    {team_name:"Westlake Prep",wins:6,losses:1,draws:1,total_points:19},
    {team_name:"CCC After-School A",wins:5,losses:3,draws:0,total_points:15},
    {team_name:"Roosevelt Middle",wins:4,losses:3,draws:1,total_points:13},
    {team_name:"Central Middle",wins:2,losses:5,draws:1,total_points:7},
  ]},
  {name:"Greater Cleveland Open",division:"All Ages",teams:[
    {team_name:"Cleveland Chess Club",wins:8,losses:0,draws:0,total_points:24},
    {team_name:"CCC Varsity",wins:6,losses:2,draws:0,total_points:18},
    {team_name:"Lakewood Knights",wins:5,losses:3,draws:0,total_points:15},
    {team_name:"Akron Chess Society",wins:3,losses:4,draws:1,total_points:10},
  ]},
  {name:"Ohio State League — South",division:"K-12",teams:[
    {team_name:"Columbus Academy",wins:7,losses:1,draws:0,total_points:21},
    {team_name:"Cincinnati Chess",wins:6,losses:2,draws:0,total_points:18},
    {team_name:"Dayton Knights",wins:4,losses:3,draws:1,total_points:13},
    {team_name:"Springfield Pawns",wins:1,losses:7,draws:0,total_points:3},
  ]},
];

function renderLeagueCard(league) {
  const teams = league.teams.sort((a,b) => b.total_points - a.total_points);
  return `<div class="league-card">
    <div class="league-header">
      <div class="league-name">${league.name || league.league_name}</div>
      <div class="league-badge">${league.division}</div>
    </div>
    <div class="standings-row header"><div>#</div><div>Team</div><div>W</div><div>L</div><div>D</div><div>PTS</div></div>
    ${teams.map((t,i) => `<div class="standings-row">
      <div class="standings-pos">${i+1}</div>
      <div class="standings-team">${t.team_name}</div>
      <div class="standings-val w">${t.wins}</div>
      <div class="standings-val l">${t.losses}</div>
      <div class="standings-val">${t.draws}</div>
      <div class="standings-val pts">${Number(t.total_points)}</div>
    </div>`).join('')}
  </div>`;
}

async function loadLeagues() {
  const grid = document.getElementById('leaguesGrid');
  const banner = document.getElementById('seasonBanner');
  
  try {
    // Try fetching from the team_standings view
    const { data, error } = await sb.from('team_standings')
      .select('*')
      .eq('is_active', true)
      .order('total_points', { ascending: false });

    if (error) throw error;
    if (!data || data.length === 0) throw new Error('No data');

    // Group by league
    const leagueMap = {};
    data.forEach(row => {
      if (!leagueMap[row.league_id]) {
        leagueMap[row.league_id] = { name: row.league_name, division: row.division, season: row.season_name, teams: [] };
      }
      leagueMap[row.league_id].teams.push(row);
    });

    const leagues = Object.values(leagueMap);
    const totalTeams = data.length;
    const totalMatches = data.reduce((s,t) => s + Number(t.matches_played), 0) / 2; // each match counted twice
    const seasonName = data[0]?.season_name || 'Current Season';

    banner.innerHTML = `<div class="season-banner">
      <div class="season-info"><div class="season-label">Current Season</div><div class="season-name">${seasonName}</div></div>
      <div class="season-stats">
        <div class="season-stat"><div class="sv">${totalTeams}</div><div class="sl">Teams</div></div>
        <div class="season-stat"><div class="sv">${Math.round(totalMatches)}</div><div class="sl">Matches</div></div>
        <div class="season-stat"><div class="sv">${leagues.length}</div><div class="sl">Leagues</div></div>
      </div>
    </div>`;

    grid.innerHTML = leagues.map(l => renderLeagueCard(l)).join('');

  } catch (e) {
    // Fallback to demo data
    console.log('Using demo league data:', e.message);
    
    banner.innerHTML = `<div class="demo-badge">DEMO DATA — Run leagues_schema.sql in Supabase to enable live standings</div>
    <div class="season-banner">
      <div class="season-info"><div class="season-label">Current Season</div><div class="season-name">Spring 2026 — Week 8 of 12</div></div>
      <div class="season-stats">
        <div class="season-stat"><div class="sv">24</div><div class="sl">Teams</div></div>
        <div class="season-stat"><div class="sv">186</div><div class="sl">Matches</div></div>
        <div class="season-stat"><div class="sv">4</div><div class="sl">Leagues</div></div>
      </div>
    </div>`;

    grid.innerHTML = DEMO_LEAGUES.map(l => renderLeagueCard(l)).join('');
  }
}

loadLeagues();
</script>
<script src="nav.js"></script>
</body>
</html>
