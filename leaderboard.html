<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classical Chess Collegium — Top Players</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Mono:wght@400;500&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="nav.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--black:#0a0a0a;--panel:#151515;--border:#2a2a2a;--gold:#c9a84c;--gold2:#e8c97a;--cream:#F2ECD8;--muted:#6b6b6b;--green:#4caf50}
    body{background:var(--black);color:var(--cream);font-family:'Lato',sans-serif;min-height:100vh}
    .chess-bg{position:fixed;inset:0;z-index:0;opacity:0.02;background-image:repeating-conic-gradient(var(--gold) 0% 25%,transparent 0% 50%);background-size:48px 48px;pointer-events:none}
    .page{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:48px 24px}
    .page-eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:20px}
    .page-eyebrow::before{content:'';width:24px;height:1px;background:var(--gold)}
    .page-eyebrow span{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold)}
    .page-title{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,5vw,48px);font-weight:700;line-height:1.1;margin-bottom:12px}
    .page-title em{color:var(--gold);font-style:italic}
    .page-sub{font-size:15px;color:var(--muted);font-weight:300;line-height:1.7;max-width:560px;margin-bottom:40px}
    .tabs{display:flex;gap:0;border:1px solid var(--border);margin-bottom:32px;overflow-x:auto}
    .tab{flex:1;background:transparent;border:none;border-right:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:12px 16px;cursor:pointer;transition:all 0.2s;white-space:nowrap}
    .tab:last-child{border-right:none}
    .tab:hover{color:var(--cream)}
    .tab.active{background:var(--gold);color:var(--black);font-weight:500}
    .lb-row{display:grid;grid-template-columns:48px 1fr 100px 80px 80px;align-items:center;gap:0;padding:14px 20px;border-bottom:1px solid var(--border);transition:background 0.15s}
    .lb-row:hover{background:rgba(201,168,76,0.03)}
    .lb-row.header{background:var(--panel);border-bottom:2px solid var(--gold);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);padding:10px 20px}
    .lb-rank{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;color:var(--muted);text-align:center}
    .lb-row:nth-child(2) .lb-rank{color:var(--gold);font-size:28px}
    .lb-row:nth-child(3) .lb-rank,.lb-row:nth-child(4) .lb-rank{color:var(--cream)}
    .lb-player{display:flex;align-items:center;gap:12px}
    .lb-avatar{width:36px;height:36px;background:linear-gradient(135deg,var(--gold),#8b6914);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;color:#000;flex-shrink:0}
    .lb-name{font-size:14px;font-weight:400;color:var(--cream)}
    .lb-school{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);margin-top:2px}
    .lb-rating{font-family:'DM Mono',monospace;font-size:16px;font-weight:500;color:var(--gold);text-align:center}
    .lb-games,.lb-winrate{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-align:center}
    .lb-winrate .high{color:var(--green)}
    .loading-msg{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-align:center;padding:40px;letter-spacing:0.1em}
    .empty-msg{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);text-align:center;padding:40px}
    @media(max-width:600px){
      .lb-row{grid-template-columns:36px 1fr 70px;padding:10px 12px}
      .lb-games,.lb-winrate,.lb-row.header .lb-games,.lb-row.header .lb-winrate{display:none}
    }
  </style>
</head>
<body>
<div class="chess-bg"></div>
<nav id="cccNav"></nav>
<div class="page">
  <div class="page-eyebrow"><span>Club — Leaderboard</span></div>
  <h1 class="page-title">Top <em>Players.</em></h1>
  <p class="page-sub">The highest-rated students on the Collegium platform. Rankings update after every rated game.</p>
  <div class="tabs">
    <button class="tab active" onclick="loadBoard('all',this)">Our Players</button>
    <button class="tab" onclick="loadBoard('k5',this)">K-5</button>
    <button class="tab" onclick="loadBoard('middle',this)">6-8</button>
    <button class="tab" onclick="loadBoard('high',this)">9-12</button>
    <button class="tab" onclick="loadFIDE('standard',this)">FIDE Top 100</button>
    <button class="tab" onclick="loadFIDE('rapid',this)">FIDE Rapid</button>
    <button class="tab" onclick="loadFIDE('blitz',this)">FIDE Blitz</button>
  </div>
  <div id="leaderboard"><div class="loading-msg">LOADING LEADERBOARD...</div></div>
</div>
<script>
const SB_URL='https://nlsmrveieqadjmytsmjm.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sc21ydmVpZXFhZGpteXRzbWptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3MTg4NjcsImV4cCI6MjA4NzI5NDg2N30.9uIWjPJsOhdXXHqGLIMcdY5eitbkGoHyhbreAEe-apM';
const{createClient}=supabase;
const sb=createClient(SB_URL,SB_KEY,{auth:{persistSession:true,storageKey:'ccc-auth'}});

const K5=['K','1st','2nd','3rd','4th','5th'];
const MID=['6th','7th','8th'];
const HIGH=['9th','10th','11th','12th'];

async function loadBoard(filter,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(btn)btn.classList.add('active');
  const el=document.getElementById('leaderboard');
  el.innerHTML='<div class="loading-msg">LOADING...</div>';
  try{
    let q=sb.from('profiles').select('id,username,chess_rating,grade,class_name,role')
      .eq('role','student').not('chess_rating','is',null)
      .order('chess_rating',{ascending:false}).limit(50);
    if(filter==='k5')q=q.in('grade',K5);
    else if(filter==='middle')q=q.in('grade',MID);
    else if(filter==='high')q=q.in('grade',HIGH);
    const{data:profiles,error}=await q;
    if(error)throw error;
    if(!profiles||profiles.length===0){
      el.innerHTML='<div class="empty-msg">No ranked players found yet. Play rated games to appear here.</div>';return;
    }
    const ids=profiles.map(p=>p.id);
    const{data:prog}=await sb.from('progress').select('user_id,games_played,games_won').in('user_id',ids);
    const pm={};(prog||[]).forEach(p=>{pm[p.user_id]=p});
    let html=`<div class="lb-row header"><div>#</div><div>Player</div><div>Rating</div><div class="lb-games">Games</div><div class="lb-winrate">Win %</div></div>`;
    profiles.forEach((p,i)=>{
      const pr=pm[p.id]||{};const g=pr.games_played||0;const w=pr.games_won||0;
      const wr=g>0?Math.round(w/g*100):0;
      const ini=(p.username||'?').split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const sub=[p.grade?p.grade+' grade':'',p.class_name||''].filter(Boolean).join(' · ');
      html+=`<div class="lb-row"><div class="lb-rank">${i+1}</div><div class="lb-player"><div class="lb-avatar">${ini}</div><div><div class="lb-name">${p.username||'Unknown'}</div>${sub?`<div class="lb-school">${sub}</div>`:''}</div></div><div class="lb-rating">${p.chess_rating}</div><div class="lb-games">${g}</div><div class="lb-winrate"><span class="${wr>=60?'high':''}">${wr}%</span></div></div>`;
    });
    el.innerHTML=html;
  }catch(e){console.error(e);el.innerHTML='<div class="empty-msg">Unable to load leaderboard.</div>';}
}
loadBoard('all',document.querySelector('.tab.active'));

// ── FIDE WORLD RANKINGS ──
async function loadFIDE(category, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const el = document.getElementById('leaderboard');
  el.innerHTML = '<div class="loading-msg">LOADING FIDE RANKINGS...</div>';

  // Try multiple sources
  const apis = [
    `https://fide-api.vercel.app/top/${category}`,
    `https://api.chesstools.org/fide/top?category=${category}&limit=100`,
  ];

  let players = null;

  for (const url of apis) {
    try {
      const resp = await fetch(url, { signal: AbortSignal.timeout(8000) });
      if (!resp.ok) continue;
      const data = await resp.json();
      // Normalize response format
      if (Array.isArray(data)) {
        players = data.slice(0, 100);
      } else if (data.players) {
        players = data.players.slice(0, 100);
      } else if (data.data) {
        players = data.data.slice(0, 100);
      }
      if (players && players.length > 0) break;
    } catch(e) { continue; }
  }

  // If APIs fail, try scraping FIDE top page via CORS proxy
  if (!players || players.length === 0) {
    try {
      const proxy = 'https://api.allorigins.win/raw?url=';
      const fideUrl = category === 'standard' 
        ? 'https://ratings.fide.com/top_lists.phtml' 
        : `https://ratings.fide.com/top_${category}_lists.phtml`;
      const resp = await fetch(proxy + encodeURIComponent(fideUrl), { signal: AbortSignal.timeout(8000) });
      const html = await resp.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      // Try to parse table rows
      const rows = doc.querySelectorAll('table tr');
      players = [];
      rows.forEach((row, i) => {
        if (i === 0) return; // skip header
        const cells = row.querySelectorAll('td');
        if (cells.length >= 4) {
          players.push({
            name: cells[1]?.textContent?.trim() || '',
            federation: cells[2]?.textContent?.trim() || '',
            rating: parseInt(cells[3]?.textContent?.trim()) || 0,
            title: cells[0]?.textContent?.trim() || '',
          });
        }
      });
    } catch(e) {}
  }

  // Final fallback — hardcoded top 20 (March 2026 FIDE standard list)
  if (!players || players.length === 0) {
    players = [
      {name:"Magnus Carlsen",federation:"NOR",rating:2831,title:"GM"},
      {name:"D Gukesh",federation:"IND",rating:2783,title:"GM"},
      {name:"Fabiano Caruana",federation:"USA",rating:2778,title:"GM"},
      {name:"Nodirbek Abdusattorov",federation:"UZB",rating:2771,title:"GM"},
      {name:"Hikaru Nakamura",federation:"USA",rating:2764,title:"GM"},
      {name:"Arjun Erigaisi",federation:"IND",rating:2761,title:"GM"},
      {name:"Alireza Firouzja",federation:"FRA",rating:2758,title:"GM"},
      {name:"Ian Nepomniachtchi",federation:"RUS",rating:2754,title:"GM"},
      {name:"Wei Yi",federation:"CHN",rating:2752,title:"GM"},
      {name:"Anish Giri",federation:"NED",rating:2748,title:"GM"},
      {name:"Viswanathan Anand",federation:"IND",rating:2742,title:"GM"},
      {name:"Levon Aronian",federation:"USA",rating:2741,title:"GM"},
      {name:"Vincent Keymer",federation:"GER",rating:2740,title:"GM"},
      {name:"Praggnanandhaa R",federation:"IND",rating:2738,title:"GM"},
      {name:"Maxime Vachier-Lagrave",federation:"FRA",rating:2736,title:"GM"},
      {name:"Richard Rapport",federation:"ROU",rating:2734,title:"GM"},
      {name:"Parham Maghsoodloo",federation:"IRI",rating:2731,title:"GM"},
      {name:"Wesley So",federation:"USA",rating:2727,title:"GM"},
      {name:"Nijat Abasov",federation:"AZE",rating:2724,title:"GM"},
      {name:"Daniil Dubov",federation:"RUS",rating:2720,title:"GM"},
    ];
  }

  const catLabel = category === 'standard' ? 'Classical' : category.charAt(0).toUpperCase() + category.slice(1);
  let html = `<div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:16px;letter-spacing:0.08em">FIDE ${catLabel} Ratings · <a href="https://ratings.fide.com/" target="_blank" style="color:var(--gold);text-decoration:none">ratings.fide.com</a></div>`;

  html += `<div class="lb-row header"><div>#</div><div>Player</div><div>Rating</div><div class="lb-games">Title</div><div class="lb-winrate">Fed</div></div>`;

  players.forEach((p, i) => {
    const name = p.name || p.player_name || '';
    const rating = p.rating || p.standard_elo || p.rapid_elo || p.blitz_elo || 0;
    const fed = p.federation || p.country || p.fed || '';
    const title = p.title || p.fide_title || 'GM';
    const initials = name.split(/[\s,]+/).filter(Boolean).slice(0,2).map(n=>n[0]).join('').toUpperCase();
    
    html += `<div class="lb-row">
      <div class="lb-rank">${i+1}</div>
      <div class="lb-player">
        <div class="lb-avatar" style="background:linear-gradient(135deg,#333,#1a1a1a);color:var(--gold);font-size:10px;border:1px solid var(--gold)">${initials}</div>
        <div>
          <div class="lb-name">${name}</div>
          <div class="lb-school">${fed}</div>
        </div>
      </div>
      <div class="lb-rating">${rating}</div>
      <div class="lb-games" style="color:var(--gold)">${title}</div>
      <div class="lb-winrate">${fed}</div>
    </div>`;
  });

  el.innerHTML = html;
}

</script>
<script src="nav.js"></script>
</body>
</html>
